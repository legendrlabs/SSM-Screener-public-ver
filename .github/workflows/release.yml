name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

concurrency:
  group: ssm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: |
          python -m pytest -q
          node --test tests/test_publish_release.cjs
      - name: Resolve tested release identity
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python scripts/release_identity.py
      - name: Generate immutable release manifest
        if: steps.identity.outputs.skip_publish != 'true'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python scripts/build_release_manifest.py --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --out release.json
      - name: Verify generated release manifest
        if: steps.identity.outputs.skip_publish != 'true'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ssm.release_policy import build_manifest
          root=Path('.').resolve()
          actual=json.loads((root/'release.json').read_text())
          assert actual==build_manifest(root,os.environ['RELEASE_TAG'],os.environ['SOURCE_COMMIT'])
          PY
      - name: Publish complete release
        if: steps.identity.outputs.skip_publish != 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publishRelease=require(process.env.GITHUB_WORKSPACE+'/scripts/publish_release.cjs');
            const url=await publishRelease({github,context,tag:process.env.RELEASE_TAG,
              sourceCommit:process.env.SOURCE_COMMIT,manifestPath:'release.json'});
            core.info(`Published ${url}`);
