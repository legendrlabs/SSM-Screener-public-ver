# Separate operator runtime from the packaged ChatGPT skill.
# One weekly full scan anchors bounded twice-daily, filing-delta scans.
name: SSM SEC Scan (Manual + Scheduled)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full (default) or incremental with safe fallback'
        type: choice
        default: full
        required: true
        options:
          - full
          - incremental
      days:
        description: 'Manual full SEC lookback days'
        type: choice
        required: true
        default: '7'
        options:
          - '1'
          - '3'
          - '7'
          - '14'
          - '30'
  schedule:
    - cron: '30 11 * * 1'    # Monday 20:30 KST: weekly full
    - cron: '30 11 * * 2-5'  # Tuesday-Friday 20:30 KST: incremental
    - cron: '30 22 * * 1-5'  # Tuesday-Saturday 07:30 KST: incremental

permissions:
  contents: read
  actions: read

concurrency:
  group: ssm-public-sec-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'legendrlabs/SSM-Screener-public-ver'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SSM_SEC_DISCOVERY_MODE: atom
      SSM_MARKET_PROVIDER: yfinance
      SSM_OUT: /tmp/ssm-output
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check operator SEC contact configuration
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Missing repository Actions secret SEC_USER_AGENT."
            exit 1
          fi
          echo "SEC contact configured (value not displayed)."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify manual lookback input
        id: input
        shell: bash
        env:
          REQUESTED_DAYS: ${{ inputs.days || '7' }}
        run: |
          case "$REQUESTED_DAYS" in
            1|3|7|14|30) ;;
            *) echo "::error::days must be 1, 3, 7, 14, or 30"; exit 1 ;;
          esac
          echo "days=$REQUESTED_DAYS" >> "$GITHUB_OUTPUT"

      - name: Restore previous verified checkpoint or select full scan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p "$SSM_OUT" /tmp/ssm-prior
          python scripts/scan_checkpoint.py \
            --requested "$REQUESTED_MODE" \
            --schedule "$CRON_SCHEDULE" \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/ssm-prior
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/ssm-prior/scan_plan.json').read_text())
          print('mode=' + p['mode'])
          print('days=' + str(p['days']))
          PY

      - name: Install scanner dependencies
        run: python -m pip install -e .

      - name: Verify bundled CLI without third-party imports
        run: |
          python -S scripts/run_ssm.py --help
          python -S scripts/run_ssm.py version --offline

      - name: SEC full or incremental scan
        shell: bash
        env:
          SCAN_MODE: ${{ steps.plan.outputs.mode }}
          SCAN_DAYS: ${{ steps.plan.outputs.days }}
          MANUAL_DAYS: ${{ steps.input.outputs.days }}
        run: |
          if [ "$SCAN_MODE" = incremental ]; then
            python scripts/run_ssm.py scan \
              --days "$SCAN_DAYS" \
              --incremental-state /tmp/ssm-prior/prior_seen_filings.json \
              --out "$SSM_OUT"
          else
            # Manual full keeps the user's requested lookback; schedule/fallback full uses 7.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.mode }}" = full ]; then
              SCAN_DAYS="$MANUAL_DAYS"
            fi
            python scripts/run_ssm.py scan --days "$SCAN_DAYS" --out "$SSM_OUT"
          fi
          echo "$SCAN_DAYS" > /tmp/ssm-scan-days

      - name: Validate same-run outputs and record scan provenance
        shell: bash
        run: |
          python scripts/verify_scan_outputs.py \
            --out "$SSM_OUT" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --trigger "$GITHUB_EVENT_NAME" \
            --days "$(cat /tmp/ssm-scan-days)"

      - name: Upload validated reports and checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ssm-sec-scan-${{ github.run_id }}
          path: /tmp/ssm-output/
          if-no-files-found: error
          retention-days: 7
