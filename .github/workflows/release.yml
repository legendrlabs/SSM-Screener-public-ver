name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest -q

      - name: Resolve immutable release identity
        id: identity
        shell: bash
        run: |
          TAG="${{ steps.ref.outputs.ref }}"
          SOURCE_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if [ "$SOURCE_COMMIT" != "$TAG_COMMIT" ]; then
            echo "checked-out commit does not match release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        run: |
          python scripts/build_release_manifest.py \
            --tag "${{ steps.identity.outputs.tag }}" \
            --source-commit "${{ steps.identity.outputs.source_commit }}" \
            --out release.json

      - name: Verify generated release manifest
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ssm.release_policy import build_manifest, project_version

          root = Path('.').resolve()
          manifest = json.loads(Path('release.json').read_text(encoding='utf-8'))
          expected = build_manifest(root, os.environ['RELEASE_TAG'], os.environ['SOURCE_COMMIT'])
          assert manifest == expected
          assert manifest['version'] == project_version(root)
          assert manifest['source_commit'] == os.environ['SOURCE_COMMIT']
          PY

      - name: Publish release.json asset
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `SSM ${tag}`,
                generate_release_notes: true,
              })).data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              if (asset.name === 'release.json') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

            const data = fs.readFileSync('release.json');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: 'release.json',
              headers: {
                'content-type': 'application/json',
                'content-length': data.length,
              },
              data,
            });
