name: Apply public historical capital sync
on:
  push:
    branches: [fix/transaction-capital-generalization-20261003]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transaction-capital-generalization-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_public_historical_sync.py
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: historical-sync-junit
          path: pytest.xml
      - name: Commit historical classifier
        if: success()
        run: |
          git config user.name "ssm-bot"
          git config user.email "actions@users.noreply.github.com"
          rm scripts/apply_public_historical_sync.py
          rm .github/workflows/apply-public-historical-sync.yml
          git add ssm/recapitalization.py ssm/financial_recapitalization.py scripts/apply_public_historical_sync.py .github/workflows/apply-public-historical-sync.yml
          git commit -m "feat: classify historical capital without mutating current FD"
          git push origin HEAD:fix/transaction-capital-generalization-20261003
